<!doctype html>
<html>
  <head>
    <base target="_top">
    <meta charset="UTF-8">
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 24px;
        line-height: 1.6;
      }
      .box {
        max-width: 640px;
        border: 1px solid #ddd;
        border-radius: 12px;
        padding: 24px;
      }
      button {
        margin-top: 16px;
        padding: 10px 18px;
        border: 0;
        border-radius: 8px;
        cursor: pointer;
      }
      button:disabled {
        cursor: not-allowed;
        opacity: 0.45;
      }
      #status {
        margin-top: 16px;
        white-space: pre-wrap;
      }
      .error {
        color: #b00020;
      }
    </style>
  </head>
  <body onload="checkSetup()">
    <div class="box">
      <h2>YogiDiver Rich Menu Upload</h2>
      <p>Choose a PNG or JPG. It will be resized to 2500 x 1686 and compressed under 1 MB before upload.</p>
      <input id="file" type="file" accept="image/png,image/jpeg">
      <br>
      <button id="uploadButton" onclick="upload()">Upload and Set Default</button>
      <div id="status"></div>
    </div>

    <script>
      const TARGET_WIDTH = 2500;
      const TARGET_HEIGHT = 1686;
      const MAX_BYTES = 950 * 1024;

      function checkSetup() {
        google.script.run
          .withSuccessHandler(function(result) {
            const status = document.getElementById('status');
            const button = document.getElementById('uploadButton');

            if (!result.ok) {
              button.disabled = true;
              status.className = 'error';
              status.textContent = 'Missing Script Properties:\n' + result.missing.join('\n') + '\n\nAdd them in Apps Script Project Settings > Script Properties, then redeploy or refresh this page.';
              return;
            }

            button.disabled = false;
            status.className = '';
            status.textContent = 'Ready.';
          })
          .withFailureHandler(function(error) {
            document.getElementById('status').textContent = 'Setup check failed:\n' + error.message;
          })
          .getSetupStatus();
      }

      function upload() {
        const file = document.getElementById('file').files[0];
        const status = document.getElementById('status');
        const button = document.getElementById('uploadButton');

        if (!file) {
          status.className = 'error';
          status.textContent = 'Choose a PNG or JPG file first.';
          return;
        }

        status.className = '';
        button.disabled = true;
        status.textContent = 'Processing image...';

        resizeAndCompress(file)
          .then(function(result) {
            status.textContent = 'Uploading to LINE...\nCompressed size: ' + Math.round(result.bytes.length / 1024) + ' KB';

            google.script.run
              .withSuccessHandler(function(response) {
                button.disabled = false;
                status.className = '';
                status.textContent = 'Done.\nRich Menu ID: ' + response.richMenuId;
              })
              .withFailureHandler(function(error) {
                button.disabled = false;
                status.className = 'error';
                status.textContent = 'Error:\n' + error.message;
              })
              .installRichMenuFromUpload(result.bytes, result.contentType);
          })
          .catch(function(error) {
            button.disabled = false;
            status.className = 'error';
            status.textContent = 'Error:\n' + error.message;
          });
      }

      function resizeAndCompress(file) {
        return new Promise(function(resolve, reject) {
          const reader = new FileReader();

          reader.onload = function(event) {
            const image = new Image();

            image.onload = function() {
              const canvas = document.createElement('canvas');
              canvas.width = TARGET_WIDTH;
              canvas.height = TARGET_HEIGHT;

              const ctx = canvas.getContext('2d');
              ctx.fillStyle = '#ffffff';
              ctx.fillRect(0, 0, TARGET_WIDTH, TARGET_HEIGHT);

              const sourceRatio = image.width / image.height;
              const targetRatio = TARGET_WIDTH / TARGET_HEIGHT;
              let sx = 0;
              let sy = 0;
              let sw = image.width;
              let sh = image.height;

              if (sourceRatio > targetRatio) {
                sw = image.height * targetRatio;
                sx = (image.width - sw) / 2;
              } else if (sourceRatio < targetRatio) {
                sh = image.width / targetRatio;
                sy = (image.height - sh) / 2;
              }

              ctx.drawImage(image, sx, sy, sw, sh, 0, 0, TARGET_WIDTH, TARGET_HEIGHT);
              compressCanvas(canvas, resolve, reject);
            };

            image.onerror = function() {
              reject(new Error('Cannot read image file.'));
            };

            image.src = event.target.result;
          };

          reader.onerror = function() {
            reject(new Error('Cannot read file.'));
          };

          reader.readAsDataURL(file);
        });
      }

      function compressCanvas(canvas, resolve, reject) {
        const qualities = [0.9, 0.82, 0.74, 0.66, 0.58, 0.5, 0.42];
        let index = 0;

        function tryNext() {
          if (index >= qualities.length) {
            reject(new Error('Image is still larger than 1 MB after compression. Use a simpler background image.'));
            return;
          }

          const quality = qualities[index++];
          canvas.toBlob(function(blob) {
            if (!blob) {
              reject(new Error('Cannot compress image.'));
              return;
            }

            if (blob.size <= MAX_BYTES || index >= qualities.length) {
              blob.arrayBuffer().then(function(buffer) {
                resolve({
                  bytes: Array.from(new Uint8Array(buffer)),
                  contentType: 'image/jpeg'
                });
              });
              return;
            }

            tryNext();
          }, 'image/jpeg', quality);
        }

        tryNext();
      }
    </script>
  </body>
</html>
