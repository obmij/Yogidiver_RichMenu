<!doctype html>
<html>
  <head>
    <base target="_top">
    <meta charset="UTF-8">
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 24px;
        line-height: 1.6;
      }
      .box {
        max-width: 640px;
        border: 1px solid #ddd;
        border-radius: 12px;
        padding: 24px;
      }
      button {
        margin-top: 16px;
        padding: 10px 18px;
        border: 0;
        border-radius: 8px;
        cursor: pointer;
      }
      #status {
        margin-top: 16px;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <h2>YogiDiver Rich Menu Upload</h2>
      <p>Upload a PNG image sized 2500 x 1686.</p>
      <input id="file" type="file" accept="image/png">
      <br>
      <button onclick="upload()">Upload and Set Default</button>
      <div id="status"></div>
    </div>

    <script>
      function upload() {
        const file = document.getElementById('file').files[0];
        const status = document.getElementById('status');

        if (!file) {
          status.textContent = 'Choose a PNG file first.';
          return;
        }

        status.textContent = 'Reading file...';
        const reader = new FileReader();

        reader.onload = function(event) {
          const bytes = Array.from(new Uint8Array(event.target.result));
          status.textContent = 'Uploading to LINE...';

          google.script.run
            .withSuccessHandler(function(result) {
              status.textContent = 'Done.\nRich Menu ID: ' + result.richMenuId;
            })
            .withFailureHandler(function(error) {
              status.textContent = 'Error:\n' + error.message;
            })
            .installRichMenuFromUpload(bytes);
        };

        reader.readAsArrayBuffer(file);
      }
    </script>
  </body>
</html>
