<!doctype html>
<html>
  <head>
    <base target="_top">
    <meta charset="UTF-8">
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 24px;
        line-height: 1.6;
      }
      .box {
        max-width: 640px;
        border: 1px solid #ddd;
        border-radius: 12px;
        padding: 24px;
      }
      button {
        margin-top: 16px;
        padding: 10px 18px;
        border: 0;
        border-radius: 8px;
        cursor: pointer;
      }
      button:disabled {
        cursor: not-allowed;
        opacity: 0.45;
      }
      #status {
        margin-top: 16px;
        white-space: pre-wrap;
      }
      .error {
        color: #b00020;
      }
    </style>
  </head>
  <body onload="checkSetup()">
    <div class="box">
      <h2>YogiDiver Rich Menu Upload</h2>
      <p>Upload a PNG image sized 2500 x 1686.</p>
      <input id="file" type="file" accept="image/png">
      <br>
      <button id="uploadButton" onclick="upload()">Upload and Set Default</button>
      <div id="status"></div>
    </div>

    <script>
      function checkSetup() {
        google.script.run
          .withSuccessHandler(function(result) {
            const status = document.getElementById('status');
            const button = document.getElementById('uploadButton');

            if (!result.ok) {
              button.disabled = true;
              status.className = 'error';
              status.textContent = 'Missing Script Properties:\n' + result.missing.join('\n') + '\n\nAdd them in Apps Script Project Settings > Script Properties, then redeploy or refresh this page.';
              return;
            }

            button.disabled = false;
            status.className = '';
            status.textContent = 'Ready.';
          })
          .withFailureHandler(function(error) {
            document.getElementById('status').textContent = 'Setup check failed:\n' + error.message;
          })
          .getSetupStatus();
      }

      function upload() {
        const file = document.getElementById('file').files[0];
        const status = document.getElementById('status');

        if (!file) {
          status.className = 'error';
          status.textContent = 'Choose a PNG file first.';
          return;
        }

        status.className = '';
        status.textContent = 'Reading file...';
        const reader = new FileReader();

        reader.onload = function(event) {
          const bytes = Array.from(new Uint8Array(event.target.result));
          status.textContent = 'Uploading to LINE...';

          google.script.run
            .withSuccessHandler(function(result) {
              status.className = '';
              status.textContent = 'Done.\nRich Menu ID: ' + result.richMenuId;
            })
            .withFailureHandler(function(error) {
              status.className = 'error';
              status.textContent = 'Error:\n' + error.message;
            })
            .installRichMenuFromUpload(bytes);
        };

        reader.readAsArrayBuffer(file);
      }
    </script>
  </body>
</html>
